name: SipPhone
options:
  bundleIdPrefix: com.aarneaarebye
  deploymentTarget: { macOS: "14.0" }
settings:
  base:
    DEVELOPMENT_TEAM: LKF7C4WS72
    # Development builds: Xcode manages App IDs/profiles (Release overrides this with manual Developer ID signing).
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
  configs:
    # Universal for every target (app, PacketTunnel and the Go bridge), so the Intel iMac is covered.
    Release:
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
      ENABLE_HARDENED_RUNTIME: YES
packages:
  PhoneKit: { path: Packages/PhoneKit }
  # Vendored copy of wireguard-apple's WireGuardKit (upstream manifest no longer resolves; see its Package.swift).
  WireGuardKit: { path: Packages/WireGuardKit }
targets:
  SipPhone:
    type: application
    platform: macOS
    sources:
      - App
      # Licence texts shown in the About window (Contents/Resources); checked by scripts/check-licenses.sh.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarneaarebye.sipphone
        # App/Assets.xcassets (picked up via sources: [App]); drawn by scripts/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Committed entitlements files (not generated): Debug uses the plain packet-tunnel-provider value that
        # development profiles allow; Release uses the -systemextension value (Developer ID).
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/SipPhone.Debug.entitlements
        # Developer ID distribution (scripts/release.sh, docs/RELEASE.md). Debug keeps automatic development signing.
        Release:
          CODE_SIGN_ENTITLEMENTS: App/SipPhone.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          PROVISIONING_PROFILE_SPECIFIER: "SipPhone Developer ID"
    dependencies:
      - package: PhoneKit
        product: PhoneCore
      - package: PhoneKit
        product: FritzTR064
      - package: PhoneKit
        product: SIPEngine
      - package: PhoneKit
        product: VPN
      - package: PhoneKit
        product: SystemAdapters
      - target: PacketTunnel   # embedded in Contents/Library/SystemExtensions
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "SIP Phone"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "2"
        LSUIElement: true
        NSMicrophoneUsageDescription: "Needed to make phone calls."
        NSHumanReadableCopyright: "Copyright © 2026 Aarne Aarebye"

  PacketTunnel:
    type: system-extension
    platform: macOS
    sources: [PacketTunnel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarneaarebye.sipphone.PacketTunnel
        PRODUCT_NAME: com.aarneaarebye.sipphone.PacketTunnel   # sysext bundle name must be <bundle id>.systemextension
        PRODUCT_MODULE_NAME: PacketTunnel
        SKIP_INSTALL: YES
      configs:
        # Committed entitlements files (not generated): Debug uses the plain packet-tunnel-provider value that
        # development profiles allow; Release uses the -systemextension value (Developer ID).
        Debug:
          CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.Debug.entitlements
        # Developer ID distribution (scripts/release.sh, docs/RELEASE.md). Debug keeps automatic development signing.
        Release:
          CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          PROVISIONING_PROFILE_SPECIFIER: "SipPhone PacketTunnel Developer ID"
    dependencies:
      - target: WireGuardGoBridgemacOS   # builds libwg-go.a (Go) before WireGuardKit links
      - package: WireGuardKit
        product: WireGuardKit
      - package: PhoneKit
        product: VPN                     # TunnelConfigHandoff
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: SIP Phone VPN
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "2"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        NSSystemExtensionUsageDescription: "Connects SIP Phone to your FRITZ!Box over WireGuard when you are away from home."
        NetworkExtension:
          NEMachServiceName: "$(TeamIdentifierPrefix)com.aarneaarebye.sipphone.PacketTunnel"
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"

  # External build target as in the WireGuardKit README: runs WireGuardKitGo's Makefile, which builds
  # wireguard-go with the local Go toolchain for every arch in $(ARCHS) and lipo's libwg-go.a into
  # $(CONFIGURATION_BUILD_DIR) (where WireGuardKitGo's `linkedLibrary("wg-go")` finds it).
  WireGuardGoBridgemacOS:
    type: ""
    platform: macOS
    legacy:
      toolPath: /usr/bin/make
      arguments: $(ACTION)
      passSettings: true
      workingDirectory: "$(SRCROOT)/Packages/WireGuardKit/Sources/WireGuardKitGo"
    settings:
      base:
        SDKROOT: macosx
        # The Makefile builds its cgo flags from these; current Xcode no longer exports them to external
        # build tools, without them the Go objects target the SDK version (27.x) instead of macOS 14.
        DEPLOYMENT_TARGET_CLANG_FLAG_NAME: mmacosx-version-min
        DEPLOYMENT_TARGET_CLANG_ENV_NAME: MACOSX_DEPLOYMENT_TARGET
